services:
  voice-text-tts:
    build:
      context: ..
      dockerfile: voice_text_tts_docker/Dockerfile
    image: voice-text-tts:latest
    container_name: voice-text-tts
    restart: unless-stopped
    ports:
      - "7863:7863"
    extra_hosts:
      # Linux 上需要此配置才能使用 host.docker.internal 访问宿主机
      - "host.docker.internal:host-gateway"
    environment:
      # TTS API 配置（使用 host.docker.internal 访问宿主机上的 TTS API）
      - API_HOST=host.docker.internal
      - API_PORT=50000
      - API_MODE=zero_shot
      
      # 服务器配置
      - SERVER_NAME=0.0.0.0
      - SERVER_PORT=7863
      
      # ASR 配置
      - ASR_ENABLED=false
      - ASR_BACKEND_TYPE=funasr
      
      # 限制配置
      - MAX_TEXT_LENGTH=1000

      # 预设目录配置（使用持久化目录，避免重启清空）
      - PRESETS_DIR=/app/presets

    volumes:
      # 持久化预设数据
      - ./presets:/app/presets
      # 持久化临时文件
      - ./temp:/app/temp
      
    networks:
      - voice-tts-network
      
    healthcheck:
      test: ["CMD", "python", "-c", "import socket; s = socket.socket(); s.connect(('127.0.0.1', 7863)); s.close()"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

networks:
  voice-tts-network:
    driver: bridge
